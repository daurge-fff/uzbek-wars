<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="sky-and" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1d55"/>
      <stop offset="55%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#e6cdf0"/>
    </linearGradient>
    <linearGradient id="dome-and" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9aee8"/>
      <stop offset="100%" stop-color="#7a3d99"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sky-and)"/>
  <circle cx="650" cy="85" r="45" fill="#f6e6ff" opacity="0.85"/>

  <!-- fergana valley hills -->
  <path d="M0 310 Q200 270 400 300 T800 290 V450 H0 Z" fill="#5a2d78" opacity="0.5"/>

  <!-- garden pavilion (Babur-style) -->
  <g>
    <rect x="250" y="270" width="300" height="120" fill="#e7d3ee"/>
    <rect x="250" y="270" width="300" height="12" fill="#c9a6d9"/>

    <!-- arched colonnade -->
    <g fill="#7a3d99">
      <path d="M270 390 V320 Q270 300 288 300 Q306 300 306 320 V390 Z"/>
      <path d="M330 390 V320 Q330 300 348 300 Q366 300 366 320 V390 Z"/>
      <path d="M390 390 V320 Q390 300 408 300 Q426 300 426 320 V390 Z"/>
      <path d="M450 390 V320 Q450 300 468 300 Q486 300 486 320 V390 Z"/>
      <path d="M510 390 V320 Q510 300 528 300 Q528 300 528 320 V390 Z"/>
    </g>

    <!-- central onion dome -->
    <path d="M400 260 Q360 200 400 160 Q440 200 400 260 Z" fill="url(#dome-and)"/>
    <rect x="394" y="140" width="12" height="24" fill="#c9a6d9"/>
    <circle cx="400" cy="136" r="8" fill="#f6e6ff"/>

    <!-- side small domes -->
    <path d="M290 270 Q265 235 290 205 Q315 235 290 270 Z" fill="url(#dome-and)"/>
    <path d="M510 270 Q485 235 510 205 Q535 235 510 270 Z" fill="url(#dome-and)"/>
  </g>

  <!-- garden trees either side -->
  <g fill="#4a2666">
    <circle cx="160" cy="330" r="34"/>
    <rect x="152" y="330" width="16" height="60"/>
    <circle cx="640" cy="330" r="34"/>
    <rect x="632" y="330" width="16" height="60"/>
  </g>

  <g>
    <rect x="0" y="410" width="800" height="40" fill="#3a1d55"/>
    <g fill="#9B59B6">
      <path d="M0 410 l20 40 l20 -40 Z"/><path d="M60 410 l20 40 l20 -40 Z"/>
      <path d="M120 410 l20 40 l20 -40 Z"/><path d="M180 410 l20 40 l20 -40 Z"/>
      <path d="M240 410 l20 40 l20 -40 Z"/><path d="M300 410 l20 40 l20 -40 Z"/>
      <path d="M360 410 l20 40 l20 -40 Z"/><path d="M420 410 l20 40 l20 -40 Z"/>
      <path d="M480 410 l20 40 l20 -40 Z"/><path d="M540 410 l20 40 l20 -40 Z"/>
      <path d="M600 410 l20 40 l20 -40 Z"/><path d="M660 410 l20 40 l20 -40 Z"/>
      <path d="M720 410 l20 40 l20 -40 Z"/><path d="M780 410 l20 40 l20 -40 Z"/>
    </g>
  </g>
</svg>
