# Docker Compose configuration for Uzbek Wars
# Orchestrates frontend, backend, and nginx proxy

version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: uzbek-wars-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    networks:
      - uzbek-wars-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend PWA service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: uzbek-wars-frontend
    restart: unless-stopped
    networks:
      - uzbek-wars-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx reverse proxy
  proxy:
    image: nginx:alpine
    container_name: uzbek-wars-proxy
    restart: unless-stopped
    ports:
      - "3060:80"
    volumes:
      - ./proxy-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - uzbek-wars-network
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  uzbek-wars-network:
    driver: bridge

# Volumes for persistent data (if needed in future)
volumes:
  logs:
